services:
  - type: web
    name: hover-ai-backend
    runtime: docker
    region: oregon
    plan: free

    # ── Build ──────────────────────────────────────────────────────────────────
    # The Dockerfile pins Python 3.12, installs ffmpeg (legacy WebM uploads) and
    # installs dependencies from uv.lock. Paths are relative to rootDir.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The image's CMD runs `uv run --no-sync hover`, binding 0.0.0.0:$PORT.

    # ── Migrations ────────────────────────────────────────────────────────────
    # Schema changes are applied with Alembic, never at app startup.
    # Pre-deploy commands need a paid instance type; on the free plan run this
    # from the Render Shell (or locally against the external DB URL) before
    # deploying a release that adds a migration:
    #   uv run --no-sync alembic upgrade head
    # First time only, for a database created before Alembic:
    #   uv run --no-sync alembic stamp 0001_baseline
    # preDeployCommand: uv run --no-sync alembic upgrade head

    # ── Health check ──────────────────────────────────────────────────────────
    healthCheckPath: /api/v1/health

    # ── Environment variables ─────────────────────────────────────────────────
    # Set these in the Render dashboard → Environment tab.
    # Do NOT commit real values here — this file is version-controlled.
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in dashboard

      - key: JWT_SECRET
        generateValue: true  # Render generates a secure random value

      - key: JWT_ALGORITHM
        value: HS256

      - key: JWT_EXPIRE_MINUTES
        value: "15"

      - key: JWT_REFRESH_EXPIRE_DAYS
        value: "90"

      - key: INTRON_API_KEY
        sync: false

      - key: INTRON_STT_BASE_URL
        value: https://infer.voice.intron.io

      - key: GROQ_API_KEY
        sync: false

      - key: VISION_MODEL
        value: qwen/qwen3.8-27b

      - key: WHISPER_MODEL
        value: whisper-large-v3

      - key: VISION_JSON_MODE
        value: "true"

      - key: VISION_MARKED_MAX_EDGE
        value: "1280"

      - key: TTS_MODEL
        value: canopylabs/orpheus-v1-english

      - key: TTS_VOICE
        value: autumn

      - key: TTS_ENABLED
        value: "true"

      - key: TTS_TIMEOUT_S
        value: "8"

      - key: SAHARA_TTS_ENABLED
        value: "true"

      - key: SAHARA_STT_STREAM_ENABLED
        value: "false"

      - key: LOG_LEVEL
        value: INFO
      # PORT is injected by Render automatically.
